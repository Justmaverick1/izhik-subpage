<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e1a18" />
    <meta name="description" content="<%- metaDescription %>" />
    <title><%- metaTitle %></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
:root {
  --bg: #0e1a18;
  --fg: #e4f3ef;
  --muted: #b0ccc6;
  --surface: #16302b;
  --line: #2d4e48;
  --moss: #9fd9c8;
  --moss-fg: #0e1a18;
  --clay: #f3c2b8;
  color-scheme: dark;
  font-family: Manrope, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--fg);
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100%; line-height: 1.5; }
button, a.btn { font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--moss); outline-offset: 3px; }
.top {
  position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
  transition: box-shadow 280ms ease, background-color 280ms ease;
}
.top.scrolled {
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  box-shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(12px);
}
.reveal { opacity: 0; transform: translateY(18px); }
.reveal.in {
  opacity: 1;
  transform: none;
  transition: opacity 700ms cubic-bezier(0.22, 1, 0.36, 1), transform 700ms cubic-bezier(0.22, 1, 0.36, 1);
}
body.intro { overflow: hidden; }
body.intro .top { background: transparent; border-color: transparent; box-shadow: none; }
.intro-logo {
  position: fixed;
  z-index: 30;
  left: 50%;
  top: 42%;
  width: min(86vw, 68vh);
  height: auto;
  transform: translate(-50%, -50%);
  opacity: 0;
  object-fit: contain;
  pointer-events: none;
  transition: opacity 700ms ease;
}
.intro-logo.show { opacity: 1; }
.intro-logo.fly {
  transition:
    left 1000ms cubic-bezier(0.65, 0, 0.2, 1),
    top 1000ms cubic-bezier(0.65, 0, 0.2, 1),
    width 1000ms cubic-bezier(0.65, 0, 0.2, 1),
    opacity 700ms ease;
}
.bar { max-width: 42rem; margin: 0 auto; padding: 0.75rem 1rem; }
.brand-row { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
.logo { height: 4.5rem; width: auto; max-width: 100%; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; width: 100%; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  min-height: 2.75rem; width: 100%; padding: 0.55rem 0.75rem; border-radius: 0.5rem;
  border: 1px solid var(--line); background: transparent; color: var(--fg);
  font-weight: 600; text-decoration: none; white-space: nowrap;
}
.btn.solid { background: var(--moss); color: var(--moss-fg); border-color: transparent; }
.btn:active { scale: 0.96; }
.choice { transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease, scale 180ms ease; }
.choice[aria-selected="true"], .choice[aria-checked="true"] { scale: 1; }
dialog.sheet[open] .qr-panel { animation: pop 320ms cubic-bezier(0.22, 1, 0.36, 1) both; }
dialog.sheet[open]::backdrop { animation: fade 280ms ease both; }
@keyframes pop {
  from { opacity: 0; transform: translateY(16px) scale(0.96); }
  to { opacity: 1; transform: none; }
}
@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}
.enter { max-width: 42rem; margin: 0 auto; padding: 2rem 1rem 2.5rem; display: flex; flex-direction: column; gap: 2rem; }
.stack { display: flex; flex-direction: column; gap: 0.75rem; }
.eyebrow { margin: 0; color: var(--muted); font-size: 0.875rem; }
h1, h2, h3, p { margin: 0; }
h1 { font-family: Fraunces, Palatino, serif; font-size: 2.25rem; font-weight: 560; letter-spacing: -0.02em; line-height: 1.15; }
h2 { font-size: 1.125rem; }
h3 { font-size: 1.05rem; line-height: 1.3; }
.note { font-size: 1.125rem; font-weight: 600; }
.note.bad { color: var(--clay); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 1.5rem; padding: 1rem; }
.facts { display: grid; gap: 0.75rem; }
.facts dt { color: var(--muted); font-size: 0.875rem; }
.facts dd { margin: 0.25rem 0 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.tabs, .apps, .steps, .step-actions { display: flex; flex-direction: column; gap: 0.5rem; }
.tabs { flex-direction: row; flex-wrap: wrap; }
.choice {
  min-height: 2.75rem; border: 1px solid var(--line); background: transparent; color: var(--fg);
  border-radius: 0.5rem; padding: 0.4rem 0.85rem; font-weight: 600;
}
.choice[aria-selected="true"], .choice[aria-checked="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.choice.wide { display: flex; width: 100%; align-items: center; justify-content: space-between; text-align: left; }
.hint { font-size: 0.875rem; font-weight: 600; }
.choice[aria-checked="false"] .hint { color: var(--muted); }
.steps { list-style: none; padding: 0; margin: 0; gap: 0.75rem; }
.step-head { display: flex; align-items: baseline; gap: 0.75rem; }
.num { width: 1.5rem; font-family: Fraunces, Palatino, serif; font-size: 1.25rem; color: var(--moss); }
.muted { color: var(--muted); }
.error { max-width: 32rem; margin: 4rem auto; padding: 0 1rem; }
dialog.sheet { margin: auto; width: min(28rem, calc(100% - 2rem)); border: 0; padding: 0; background: transparent; color: var(--fg); }
dialog.sheet::backdrop { background: rgba(8, 16, 14, 0.62); }
.qr-panel { display: flex; flex-direction: column; gap: 0.75rem; }
.qr { background: #fff; border-radius: 0.5rem; padding: 0.75rem; }
.qr svg { width: 100%; height: auto; display: block; }
@media (min-width: 40rem) {
  .brand-row { flex-direction: row; justify-content: space-between; }
  .logo { height: 5.5rem; }
  .actions { display: flex; width: auto; justify-content: flex-end; }
  .actions .btn, .step-actions .btn { width: auto; }
  .facts { grid-template-columns: repeat(3, 1fr); }
  .step-actions { flex-direction: row; flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) {
  .btn:active { scale: 1; }
  .choice, .top, .reveal.in { transition: none; }
  .reveal { opacity: 1; transform: none; }
  .intro-logo { display: none; }
  dialog.sheet[open] .qr-panel, dialog.sheet[open]::backdrop { animation: none; }
}

    </style>
  </head>

  return value[state.lang] || value.ru || value.en || Object.values(value)[0] || "";
}

function guessPlatform() {
  const ua = navigator.userAgent;
  if (/Apple ?TV/i.test(ua)) return "appleTV";
  if (/Android/i.test(ua) && /TV|AFT|BRAVIA/i.test(ua)) return "androidTV";
  if (/Android/i.test(ua)) return "android";
  if (/iPhone|iPad|iPod/i.test(ua)) return "ios";
  if (/Mac OS X/i.test(ua)) return "macos";
  if (/Windows/i.test(ua)) return "windows";
  if (/Linux/i.test(ua)) return "linux";
  return "ios";
}

function daysNote(user) {
  const tr = state.config.baseTranslations;
  if (!user.expiresAt) return textOf(tr.unknown);
  const exp = new Date(user.expiresAt);
  if (Number.isNaN(exp.getTime())) return textOf(tr.unknown);
  if (exp.getFullYear() >= 2099) return textOf(tr.indefinitely);
  const days = Math.max(0, Math.round(Math.abs(exp.getTime() - Date.now()) / 86400000));
  const relative = new Intl.RelativeTimeFormat(state.lang, { numeric: "auto" }).format(
    exp.getTime() < Date.now() ? -days : days,
    "day",
  );
  if (exp.getTime() < Date.now() || user.daysLeft < 0 || user.userStatus === "EXPIRED") {
    return `${textOf(tr.expired)} ${relative}`;
  }
  return `${textOf(tr.expiresIn)} ${relative}`;
}

function formatDate(value) {
  const tr = state.config.baseTranslations;
  if (!value) return textOf(tr.unknown);
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return textOf(tr.unknown);
  if (date.getFullYear() >= 2099) return textOf(tr.indefinitely);
  return new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "long", year: "numeric" }).format(date);
}

function limitText(value) {
  if (value == null || value === "" || value === "0" || value === 0) return "∞";
  return String(value);
}

function isExpired(user) {
  if (user.userStatus === "EXPIRED" || user.userStatus === "DISABLED" || user.userStatus === "LIMITED") return true;
  if (typeof user.daysLeft === "number" && user.daysLeft < 0) return true;
  if (user.expiresAt) {
    const exp = new Date(user.expiresAt);
    if (!Number.isNaN(exp.getTime()) && exp.getFullYear() < 2099 && exp.getTime() < Date.now()) return true;
  }
  return false;
}

function availablePlatforms() {
  return PLATFORM_ORDER.filter((id) => state.config.platforms[id]?.apps?.length);
}

function currentPlatform() {
  return state.config.platforms[state.platform];
}

function currentApp() {
  const apps = currentPlatform().apps;
  return apps[state.appIndex] || apps[0];
}

function subscriptionUrl(shortUuid) {
  const url = new URL(location.href);
  url.search = "";
  url.hash = "";
  const parts = url.pathname.split("/").filter(Boolean);
  if (parts.at(-1) !== shortUuid) {
    if (parts.length) parts.pop();
    parts.push(shortUuid);
  }
  url.pathname = `/${parts.join("/")}`;
  return url.toString();
}

function fillTemplate(template) {
  return String(template).replace(/\{\{(\w+)\}\}/g, (match, key) => {
    if (key === "USERNAME") return state.user.username || "";
    if (key === "SUBSCRIPTION_LINK") return state.subUrl;
    return match;
  });
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function telegramIcon() {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("width", "18");
  svg.setAttribute("height", "18");
  svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("fill", "currentColor");
  path.setAttribute(
    "d",
    "M21.8 4.3 2.9 11.6c-1.3.5-1.3 1.2-.2 1.5l4.8 1.5 1.9 5.7c.2.7.1 1 .9.9.5 0 .7-.2 1-.5l2.2-2.1 4.6 3.4c.8.5 1.4.2 1.6-.8l3-14.2c.3-1.3-.5-1.9-1.5-1.5ZM8.7 14.1l9.4-5.9c.4-.3.8-.1.5.2l-7.8 7-.3 3.2-1.8-4.5Z",
  );
  svg.append(path);
  return svg;
}

function qrIcon() {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("width", "18");
  svg.setAttribute("height", "18");
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "2");
  svg.setAttribute("aria-hidden", "true");
  ["M4 4h6v6H4z", "M14 4h6v6h-6z", "M4 14h6v6H4z", "M14 14h2v2h-2z", "M18 14h2v2h-2z", "M14 18h2v2h-2z", "M18 18h2v2h-2z"].forEach((d) => {
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    svg.append(path);
  });
  return svg;
}

function openButton(button) {
  const href = button.type === "external" ? button.link : fillTemplate(button.link);
  if (button.type === "copyButton") {
    navigator.clipboard.writeText(href).catch(() => {});
    return;
  }
  if (/^https?:/i.test(href)) {
    window.open(href, "_blank", "noopener");
    return;
  }
  location.href = href;
}

function showError(message) {
  const app = document.getElementById("app");
  app.replaceChildren(el("p", "error", message));
}

function render() {
  const app = document.getElementById("app");
  const config = state.config;
  const user = state.user;
  const platform = currentPlatform();
  const selected = currentApp();
  const expired = isExpired(user);
  const tr = config.baseTranslations;
  const logoSrc = config.brandingSettings.logoUrl && !config.brandingSettings.logoUrl.includes("docs.rw")
    ? config.brandingSettings.logoUrl
    : document.getElementById("logo-data").textContent.trim();

  const header = el("header", "top");
  const bar = el("div", "bar");
  const brand = el("div", "brand-row");
  const logo = document.createElement("img");
  logo.className = "logo";
  logo.alt = "Izhik VPN";
  logo.src = logoSrc;
  const actions = el("div", "actions");
  if (config.brandingSettings.supportUrl) {
    const support = document.createElement("a");
    support.className = "btn";
    support.href = config.brandingSettings.supportUrl;
    support.target = "_blank";
    support.rel = "noreferrer noopener";
    support.setAttribute("aria-label", "Написать в поддержку");
    support.append(telegramIcon(), document.createTextNode("Поддержка"));
    actions.append(support);
  }
  if (!config.baseSettings?.hideGetLinkButton) {
    const qr = el("button", "btn", "QR-код");
    qr.type = "button";
    qr.setAttribute("aria-label", "Получить ссылку");
    qr.prepend(qrIcon());
    qr.addEventListener("click", openQr);
    actions.append(qr);
  }
  brand.append(logo, actions);
  bar.append(brand);
  header.append(bar);

  const main = el("main", "enter");
  const info = el("section", "stack");
  info.append(el("p", "eyebrow", "Подписка"));
  info.append(el("h1", null, user.username || ""));
  const note = el("p", expired ? "note bad" : "note", daysNote(user));
  info.append(note);
  const facts = el("dl", "panel facts");
  [
    [textOf(tr.expires), formatDate(user.expiresAt)],
    [textOf(tr.bandwidth), user.trafficUsed || "0"],
    ["Лимит", limitText(user.trafficLimit)],
  ].forEach(([label, value]) => {
    const item = el("div");
    item.append(el("dt", null, label), el("dd", null, value));
    facts.append(item);
  });
  info.append(facts);

  const devices = el("section", "stack");
  devices.append(el("h2", null, "Устройство"));
  const tabs = el("div", "tabs");
  tabs.setAttribute("role", "tablist");
  tabs.setAttribute("aria-label", "Устройство");
  availablePlatforms().forEach((id) => {
    const button = el("button", "choice", textOf(state.config.platforms[id].displayName));
    button.type = "button";
    button.setAttribute("role", "tab");
    button.setAttribute("aria-selected", String(id === state.platform));
    button.addEventListener("click", () => {
      state.platform = id;
      const apps = state.config.platforms[id].apps;
      const featured = apps.findIndex((item) => item.featured);
      state.appIndex = featured >= 0 ? featured : 0;
      render();
    });
    tabs.append(button);
  });
  devices.append(tabs);

  const appsSection = el("section", "stack");
  appsSection.append(el("h2", null, "Приложение"));
  const apps = el("div", "apps");
  apps.setAttribute("role", "radiogroup");
  apps.setAttribute("aria-label", "Приложение");
  platform.apps.forEach((item, index) => {
    const button = el("button", "choice wide");
    button.type = "button";
    button.setAttribute("role", "radio");
    button.setAttribute("aria-checked", String(index === state.appIndex));
    const name = el("span", null, item.name);
    button.append(name);
    if (item.featured) button.append(el("span", "hint", "Рекомендуем"));
    button.addEventListener("click", () => {
      state.appIndex = index;
      render();
    });
    apps.append(button);
  });
  appsSection.append(apps);

  const stepsSection = el("section", "stack");
  stepsSection.append(el("h2", null, `Как подключить ${selected.name}`));
  const list = el("ol", "steps");
  selected.blocks.forEach((block, index) => {
    const item = el("li", "panel step");
    const head = el("div", "step-head");
    head.append(el("span", "num", String(index + 1)), el("h3", null, textOf(block.title)));
    item.append(head);
    const description = textOf(block.description);
    if (description) item.append(el("p", "muted", description));
    if (block.buttons?.length) {
      const row = el("div", "step-actions");
      block.buttons.forEach((button) => {
        const link = el("button", button.type === "subscriptionLink" ? "btn solid" : "btn", textOf(button.text));
        link.type = "button";
        link.addEventListener("click", () => openButton(button));
        row.append(link);
      });
      item.append(row);
    }
    list.append(item);
  });
  stepsSection.append(list);
  const sequence = [
    ...actions.children,
    info,
    devices.querySelector("h2"),
    ...tabs.children,
    appsSection.querySelector("h2"),
    ...apps.children,
    stepsSection.querySelector("h2"),
    ...list.children,
  ].filter(Boolean);

  main.append(info, devices, appsSection, stepsSection);
  app.replaceChildren(header, main);
  if (!state.scrollBound) {
    state.scrollBound = true;
    addEventListener("scroll", () => {
      document.querySelector(".top")?.classList.toggle("scrolled", scrollY > 12);
    }, { passive: true });
  }
  playIntro(logo, sequence);
  state.ready = true;
}

function showSequence(nodes) {
  nodes.forEach((node, index) => {
    node.classList.add("reveal");
    node.style.transitionDelay = `${index * 90}ms`;
  });
  requestAnimationFrame(() => nodes.forEach((node) => node.classList.add("in")));
}

function finishIntro(logo, intro, nodes) {
  if (state.introDone) return;
  state.introDone = true;
  logo.style.visibility = "";
  intro.remove();
  document.body.classList.remove("intro");
  showSequence(nodes);
}

function playIntro(logo, nodes) {
  if (state.introPlayed || matchMedia("(prefers-reduced-motion: reduce)").matches) {
    nodes.forEach((node) => node.classList.add("reveal", "in"));
    return;
  }
  state.introPlayed = true;
  document.body.classList.add("intro");
  logo.style.visibility = "hidden";
  const intro = document.createElement("img");
  intro.className = "intro-logo";
  intro.alt = "";
  intro.src = logo.currentSrc || logo.src;
  document.body.append(intro);
  const arm = () => {
    requestAnimationFrame(() => {
      const box = intro.getBoundingClientRect();
      intro.style.left = `${box.left}px`;
      intro.style.top = `${box.top}px`;
      intro.style.width = `${box.width}px`;
      intro.style.transform = "none";
      intro.classList.add("show");
      setTimeout(() => {
        const target = logo.getBoundingClientRect();
        intro.classList.add("fly");
        requestAnimationFrame(() => {
          intro.style.left = `${target.left}px`;
          intro.style.top = `${target.top}px`;
          intro.style.width = `${target.width}px`;
        });
      }, 1100);
    });
  };
  if (intro.complete && intro.naturalWidth) arm();
  else intro.addEventListener("load", arm, { once: true });
  intro.addEventListener("transitionend", (event) => {
    if (!intro.classList.contains("fly") || event.propertyName !== "width") return;
    finishIntro(logo, intro, nodes);
  });
  setTimeout(() => finishIntro(logo, intro, nodes), 2400);
}

function openQr() {
  const dialog = el("dialog", "sheet");
  const panel = el("div", "panel qr-panel");
  panel.append(el("h2", null, "Ссылка подписки"));
  const pad = el("div", "qr");
  pad.innerHTML = renderSVG(state.subUrl, {
    pixelSize: 6,
    border: 2,
    blackColor: "#1c1916",
    whiteColor: "#fffcf7",
  });
  panel.append(pad);
  panel.append(el("p", "muted", "Отсканируйте код в приложении или скопируйте ссылку."));
  const copy = el("button", "btn solid", "Скопировать ссылку");
  copy.type = "button";
  copy.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(state.subUrl);
      copy.textContent = "Скопировано";
    } catch {
      copy.textContent = "Не удалось скопировать";
    }
  });
  const close = el("button", "btn", "Закрыть");
  close.type = "button";
  close.addEventListener("click", () => dialog.close());
  panel.append(copy, close);
  dialog.append(panel);
  dialog.addEventListener("click", (event) => {
    if (event.target === dialog) dialog.close();
  });
  dialog.addEventListener("close", () => dialog.remove());
  document.body.append(dialog);
  dialog.showModal();
}

async function start() {
  const raw = document.getElementById("sbpg")?.dataset.panel;
  if (!raw) {
    showError("Нет данных подписки.");
    return;
  }
  let payload;
  try {
    payload = decodePanel(raw);
  } catch {
    showError("Не удалось прочитать данные подписки.");
    return;
  }
  state.user = payload.response?.user || payload.user;
  if (!state.user) {
    showError("Не удалось прочитать данные подписки.");
    return;
  }
  state.subUrl = subscriptionUrl(state.user.shortUuid);
  try {
    const response = await fetch(`/assets/.app-config-v2.json?v=${Date.now()}`, { credentials: "same-origin" });
    if (!response.ok) throw new Error(String(response.status));
    state.config = await response.json();
  } catch {
    showError("Не удалось загрузить настройки страницы. Перезапустите контейнер страницы подписки.");
    return;
  }
  const locales = state.config.locales || ["ru"];
  const browser = (navigator.language || "ru").slice(0, 2);
  state.lang = locales.includes(browser) ? browser : locales.includes("ru") ? "ru" : locales[0];
  const platforms = availablePlatforms();
  const guessed = guessPlatform();
  state.platform = platforms.includes(guessed) ? guessed : platforms[0];
  const apps = currentPlatform().apps;
  const featured = apps.findIndex((item) => item.featured);
  state.appIndex = featured >= 0 ? featured : 0;
  render();
}

start();
